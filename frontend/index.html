<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05080c">

    <title>ROLEX AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <div>
                <h1>ROLEX AI</h1>
                <span>PERSONAL INTELLIGENCE</span>
            </div>

            <div class="system-dot">
                <i></i>
                ONLINE
            </div>
        </header>


        <section class="core-section">

            <div class="core">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="orbit orbit-three"></div>

                <div class="core-center">
                    <strong>RX</strong>
                    <small>CORE</small>
                </div>
            </div>

            <div class="core-status">
                SYSTEM CORE ACTIVE
            </div>

        </section>


        <section class="status-panel">

            <div class="status-card">
                <span>CORE</span>
                <b class="online">ONLINE</b>
            </div>

            <div class="status-card">
                <span>NETWORK</span>
                <b class="online">ONLINE</b>
            </div>

            <div class="status-card">
                <span>MEMORY</span>
                <b class="ready">READY</b>
            </div>

            <div class="status-card">
                <span>VOICE</span>
                <b class="locked">STANDBY</b>
            </div>

        </section>


        <section class="terminal">

            <div class="terminal-head">
                <span>ROLEX TERMINAL</span>
                <span>LOCAL MODE</span>
            </div>

            <div class="chat" id="chat"></div>

        </section>


        <section class="command-area">

            <textarea
              id="msg"
              placeholder="Speak or type your command..."
              rows="3"
        ></textarea>

            <button id="send">
                SEND
            </button>

        </section>


        <button class="voice-button" id="voiceButton">
            <span>●</span>
            VOICE
        </button>


        <footer>
            ROLEX AI MOBILE EDITION
        </footer>

    </main>

    <script src="script.js"></script>

</body>
    </html>
